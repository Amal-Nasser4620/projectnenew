<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassiAds - Giant Subsets of Professional Classified Ads</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0264ec',
                            darkBlue: '#002663',
                            navy: '#0b132a',
                            cyan: '#00c3ff',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Soft background glowing blur effect */
        .bg-glow-1 {
            background: radial-gradient(circle, rgba(2, 100, 236, 0.15) 0%, rgba(0, 195, 255, 0.2) 50%, rgba(255, 255, 255, 0) 70%);
        }
        .bg-glow-2 {
            background: radial-gradient(circle, rgba(0, 195, 255, 0.25) 0%, rgba(2, 100, 236, 0.1) 60%, rgba(255, 255, 255, 0) 80%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col relative overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Background Gradient Blurs -->
    <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] bg-glow-1 rounded-full blur-3xl pointer-events-none z-0"></div>
    <div class="absolute top-[20%] right-[-100px] w-[600px] h-[600px] bg-glow-2 rounded-full blur-3xl pointer-events-none z-0"></div>

    <!-- Header / Navigation Bar -->
    <header class="relative z-20 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
        <nav class="flex items-center justify-between h-16 bg-white/60 backdrop-blur-md px-6 rounded-2xl border border-white/80 shadow-sm">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <a href="#" class="flex items-center">
                    <img src="log.png" alt="ClassiAds Logo" class="h-10 w-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/160x45/002663/ffffff?text=ClassiAds'">
                </a>
            </div>

            <!-- Desktop Nav Links -->
            <div class="hidden md:flex items-center space-x-8 text-sm font-semibold text-slate-600">
                <a href="#" class="text-brand-blue hover:text-brand-blue transition-colors">HOME</a>
                <a href="#" class="hover:text-brand-blue transition-colors">FEATURED</a>
                <a href="#" class="hover:text-brand-blue transition-colors">TRENDING</a>
                
                <!-- Dashboard Dropdown -->
                <div class="relative group cursor-pointer">
                    <button class="flex items-center space-x-1 hover:text-brand-blue transition-colors py-2 focus:outline-none">
                        <span>DASHBOARD</span>
                        <i class="fa-solid font-bold fa-chevron-down text-xs text-slate-400 group-hover:text-brand-blue transition-transform group-hover:rotate-180"></i>
                    </button>
                    <!-- Dropdown menu -->
                    <div class="absolute top-full right-0 w-48 bg-white rounded-xl shadow-xl py-2 border border-slate-100 opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                        <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-blue">User Dashboard</a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-blue">My Listings</a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-blue">Analytics</a>
                    </div>
                </div>
            </div>

            <!-- Right Login Button -->
            <div class="hidden sm:flex items-center space-x-4">
                <a href="#" class="bg-brand-blue hover:bg-blue-700 text-white font-semibold px-7 py-2.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                    Login
                </a>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-btn" class="text-slate-600 hover:text-brand-blue focus:outline-none p-2">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </nav>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden mt-3 bg-white/95 backdrop-blur-md rounded-2xl p-5 border border-slate-100 shadow-xl space-y-3 font-semibold text-slate-700">
            <a href="#" class="block px-3 py-2 rounded-lg text-brand-blue bg-blue-50">HOME</a>
            <a href="#" class="block px-3 py-2 rounded-lg hover:bg-slate-50">FEATURED</a>
            <a href="#" class="block px-3 py-2 rounded-lg hover:bg-slate-50">TRENDING</a>
            <a href="#" class="block px-3 py-2 rounded-lg hover:bg-slate-50">DASHBOARD</a>
            <hr class="border-slate-100 my-2">
            <a href="#" class="block w-full text-center bg-brand-blue text-white py-2.5 rounded-xl font-semibold shadow-md">
                Login
            </a>
        </div>
    </header>

    <!-- Main Hero Section (موسع ومكبر) -->
    <main class="relative z-10 flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center py-6 lg:py-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-4 items-center w-full">
            
            <!-- Left Column: Typography & Search Input -->
            <div class="lg:col-span-5 space-y-8 text-center lg:text-left z-10">
                
                <!-- Main Headline -->
                <div class="space-y-4">
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-brand-navy leading-[1.15] tracking-tight">
                        Glad Subse of <br class="hidden sm:inline" />
                        <span class="text-slate-900">Professional</span> <br class="hidden sm:inline" />
                        Classified Ads
                    </h1>
                </div>

                <!-- Search Input Box & Button -->
                <div class="pt-2 max-w-md mx-auto lg:mx-0">
                    <form onsubmit="event.preventDefault();" class="space-y-4">
                        <!-- Custom Input Field -->
                        <div class="relative flex items-center bg-white rounded-full border-2 border-brand-blue/30 shadow-sm focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-blue-100 transition-all p-1.5">
                            <i class="fa-solid fa-magnifying-glass text-slate-400 pl-4 pr-2 text-lg"></i>
                            <input 
                                type="text" 
                                placeholder="Search categories..." 
                                class="w-full bg-transparent border-0 focus:ring-0 focus:outline-none text-slate-700 placeholder-slate-400 font-medium px-2 py-2"
                            >
                        </div>

                        <!-- Search Button -->
                        <div>
                            <button 
                                type="submit" 
                                class="group w-full sm:w-auto bg-brand-blue hover:bg-blue-700 active:bg-brand-darkBlue text-white font-semibold px-8 py-3.5 rounded-full shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transition-all duration-300 transform hover:scale-[1.03] active:scale-[0.95] flex items-center justify-center space-x-2 outline-none focus:ring-4 focus:ring-blue-300"
                            >
                                <span>Search your</span>
                                <i class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1.5 active:translate-x-2"></i>
                            </button>
                        </div>
                    </form>
                </div>

            </div>

            <!-- Right Column: Hero Feature Image (تم تكبير الصورة وتقسيم المساحة) -->
            <div class="lg:col-span-7 relative flex justify-center lg:justify-end items-center">
                <!-- Decorative Glow Frame behind image -->
                <div class="absolute inset-0 bg-gradient-to-tr from-cyan-400/30 to-blue-600/40 rounded-full filter blur-3xl transform scale-105 -z-10"></div>
                
                <!-- Main Graphic Container (مكبر بدون قيود max-w-lg) -->
                <div class="relative w-full max-w-2xl xl:max-w-3xl transform lg:scale-110 transition-transform duration-500 hover:scale-[1.12]">
                    <img 
                        src="image1.png" 
                        alt="Classified Ads Graphic" 
                        class="w-full h-auto object-contain drop-shadow-2xl rounded-2xl"
                        onerror="this.onerror=null; this.src='https://placehold.co/700x700/002663/ffffff?text=ClassiAds+Hero+Image'"
                    >
                </div>
            </div>

        </div>
    </main>

    <!-- Mobile Menu Toggle Script -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
